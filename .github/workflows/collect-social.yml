name: Collect social media mentions

# Public Bluesky, YouTube and Reddit posts (and their comments) that name
# each node, with language and sentiment, via Anugra's social-collector
# (scripts/collect_social.py). Runs weekly on Monday at 14:40 JST and
# commits to the `live-data` branch. The minute is clear of the hourly
# live-data job (:15), Rakuten (00:30 UTC), the Google reviews (03:45 UTC)
# and Instagram (04:50 UTC): they share one concurrency queue, which keeps
# only one waiting run, so two runs starting together would cancel one.
# Secrets: YOUTUBE_API_KEY; REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET,
# REDDIT_USER_AGENT; optional BLUESKY_HANDLE, BLUESKY_APP_PASSWORD. A
# platform without its secrets is skipped; Bluesky needs none.

on:
  schedule:
    - cron: "40 5 * * 1"  # UTC; = Monday 14:40 JST
  workflow_dispatch:
    inputs:
      platforms:
        description: "Only these platforms (space-separated: bluesky youtube reddit); empty = all"
        required: false
        default: ""

permissions:
  contents: write

# Same group as the other collectors, so they never push to `live-data`
# at the same time.
concurrency:
  group: collect-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out live-data branch
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git fetch --depth 1 origin live-data
            git worktree add history origin/live-data
            git -C history switch -c live-data
          else
            git worktree add --orphan -b live-data history
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-social.txt

      # The sentiment and translation models (~1.5 GB), downloaded once.
      # Its own key: a cache is never overwritten, and Instagram's (which runs
      # first) holds only the sentiment model, no translators.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-social-${{ hashFiles('src/dhde_preprocessing/sentiment.py') }}

      - name: Collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ -n "$PLATFORMS" ]; then
            python scripts/collect_social.py --out history --platform $PLATFORMS
          else
            python scripts/collect_social.py --out history
          fi

      - name: Commit to live-data
        if: always()
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898889+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Social media mentions $(date -u +%Y-%m-%d)"
          git push origin live-data
