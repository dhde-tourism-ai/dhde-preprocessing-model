name: Collect Instagram posts

# New Instagram posts tagged at each node, via the Apify Instagram
# Scraper. Runs weekly on Monday at 13:50 JST and commits to the
# `live-data` branch, keeping main free of data commits. The minute is
# clear of the hourly live-data job (:15), Rakuten (00:30 UTC) and the
# Google reviews (03:45 UTC, which can take a while): they
# share one concurrency queue, which keeps only one waiting run, so two
# runs starting together would cancel one of them.
# Needs the APIFY_TOKEN repository secret; without it the job does nothing.

on:
  schedule:
    - cron: "50 4 * * 1"  # UTC; = Monday 13:50 JST
  workflow_dispatch:
    inputs:
      find_places:
        description: "Only look up Instagram place ids for these names (comma-separated); collects nothing"
        required: false
        default: ""

permissions:
  contents: write

# Same group as the other collectors, so they never push to `live-data`
# at the same time.
concurrency:
  group: collect-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out live-data branch
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git fetch --depth 1 origin live-data
            git worktree add history origin/live-data
            git -C history switch -c live-data
          else
            git worktree add --orphan -b live-data history
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FIND_PLACES: ${{ inputs.find_places }}
        run: |
          if [ -n "$FIND_PLACES" ]; then
            python scripts/collect_instagram.py --find-places "$FIND_PLACES"
          else
            python scripts/collect_instagram.py --out history
          fi

      - name: Commit to live-data
        if: always()
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898889+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Instagram posts $(date -u +%Y-%m-%d)"
          git push origin live-data
