name: Collect Rakuten snapshots

# Rakuten Travel keeps no history: each day's hotel-availability snapshot
# exists only if we take it that day. Runs once a day at 09:30 JST and
# commits to the `live-data` branch, keeping main free of data commits.
# Needs the RAKUTEN_APP_ID and RAKUTEN_ACCESS_KEY repository secrets, and
# the Rakuten app must not be restricted to one IP (Actions runners change).

on:
  schedule:
    - cron: "30 0 * * *"  # UTC; = 09:30 JST
  workflow_dispatch:

permissions:
  contents: write

# Same group as the hourly live-data job, so the two never push to
# `live-data` at the same time.
concurrency:
  group: collect-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out live-data branch
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git fetch --depth 1 origin live-data
            git worktree add history origin/live-data
            git -C history switch -c live-data
          else
            git worktree add --orphan -b live-data history
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python scripts/collect_rakuten.py --out history

      - name: Commit to live-data
        if: always()
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898889+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Rakuten snapshots $(date -u +%Y-%m-%d)"
          git push origin live-data
