name: Collect live data

# JARTIC (~3 months retention) and TomTom (live only) can't be backfilled,
# so their history only exists if we save it. Hourly weather (JMA observed,
# Open-Meteo JMA forecast ahead) is saved with them. Runs hourly 06:15-21:15 JST
# and commits to the `live-data` branch, keeping main free of data commits.
# Needs the TOMTOM_API_KEY repository secret; without it only JARTIC runs.

on:
  schedule:
    - cron: "15 21-23,0-12 * * *"  # UTC; = 06:15 to 21:15 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out live-data branch
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git fetch --depth 1 origin live-data
            git worktree add history origin/live-data
            git -C history switch -c live-data
          else
            git worktree add --orphan -b live-data history
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/collect_live.py --out history

      - name: Commit to live-data
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898889+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin live-data
