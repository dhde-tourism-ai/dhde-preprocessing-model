  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300015]  # 越前大野城・城下町 エリア only — not pooled with the
                          # other 大野市 areas (荒島の郷, 九頭竜湖駅, 六呂師高原)

  traffic:
    enabled: true
    layer: t_travospublic_measure_1h  # permanent counter layer, not CCTV
    point_code: 6110840
    distance_km: 3.9
    reason: >
      Included but flagged: permanent counter ~3.9km from the castle town
      (queried live 2026-09-27; nearest CCTV counter is ~23.7km). NOT
      confirmed to sit on the road visitors use; verify before treating
      this as a precise local signal.

  footfall_proxy:
    enabled: true  # no camera here: nearest camera + pooled nearby survey volume
    radii_km: [5, 15]  # 30km would reach Fukui Station, a city hub: too different to stand in

  road_congestion:
    enabled: true  # TomTom Orbis flow tiles, needs TOMTOM_API_KEY; see sources/road_congestion.py
    radius_km: 2
