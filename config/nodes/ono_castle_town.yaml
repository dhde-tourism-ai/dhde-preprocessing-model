node_key: ono_castle_town
label: "Ono Castle Town (越前大野城・城下町)"
coordinates:
  lat: 35.986586
  lon: 136.483062  # 越前大野城・城下町 エリア, area.csv 親番号 300015

sources:
  camera:
    enabled: false
    reason: >
      No camera source exists for Ono in fukui-kanko-people-flow-data
      (checked 2026-09-27). Do not fabricate one — this gap stays visible
      in the coverage report as "unavailable."

  weather:
    enabled: true
    station_name: "大野 (Ono)"
    station_id: "57121"  # nearest JMA station, ~2km
    prec_no: "57"
    block_no: "0573"
    page: hourly_a1
    start_date: "2024-12-01"

  rsi:
    enabled: true
    repo: fukui-kanko-trend-data
    area_name: "大野市"  # tracked from the 2024 folder onward

  hotel:
    enabled: true
    repo: echizen-coast-kanko-reservation
    scope: regional

  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300015]  # 越前大野城・城下町 エリア only — not pooled with the
                          # other 大野市 areas (荒島の郷, 九頭竜湖駅, 六呂師高原)

  traffic:
    enabled: false
    reason: >
      No CCTV counter within range — nearest (6810150) is ~23.7km away
      (queried live 2026-09-27). A permanent counter (6110840) sits ~3.9km
      away, but traffic.py only reads the CCTV layer; enabling it needs a
      code change, not just config.
