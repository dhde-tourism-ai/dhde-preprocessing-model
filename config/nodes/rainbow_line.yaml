node_key: rainbow_line
label: "Rainbow Line (レインボーライン)"
coordinates:
  lat: 35.601189
  lon: 135.8688963  # レインボーライン エリア, area.csv id 300059

# Official annual visitors (観光客入込数, gross visits), used to convert a
# forecast's measured count into visitors. See docs/site_capacity.md.
official_visitors:
  year: 2025
  count: 443000
  source: "https://www.pref.fukui.lg.jp/doc/kankou/fukuiken-kankoukyakusu_d/fil/024.pdf"

sources:
  camera:
    enabled: true
    # Two separate gates, kept as separate columns rather than summed —
    # see PR discussion. IMPORTANT: these are parking-lot entrance gates
    # with NO Person.csv — only LicensePlate.csv (vehicles) and Face.csv
    # exist here, confirmed against the real repo. That produces
    # gate1_vehicle_count / gate2_vehicle_count, NOT gate1_count —
    # deliberately not comparable to the other nodes' person counts.
    gates:
      - name: gate1
        license_plate_csv: fukui-kanko-people-flow-data/full/rainbow-line-parking-lot-1-gate/LicensePlate.csv
        face_csv: fukui-kanko-people-flow-data/full/rainbow-line-parking-lot-1-gate/Face.csv
      - name: gate2
        license_plate_csv: fukui-kanko-people-flow-data/full/rainbow-line-parking-lot-2-gate/LicensePlate.csv
        face_csv: fukui-kanko-people-flow-data/full/rainbow-line-parking-lot-2-gate/Face.csv

  jma_warning:
    # JMA warnings in force (sources/weather_warnings.py): office and municipality
    # (class20) codes from bosai/common/const/area.json.
    office: "180000"  # 福井県
    areas: ["1844200", "1850100"]  # 美浜町, 若狭町: the road crosses both

  weather:
    enabled: true
    station_name: "美浜 (Mihama)"
    station_id: "57286"
    prec_no: "57"
    block_no: "1010"
    page: hourly_a1
    start_date: "2024-12-01"

  rsi:
    enabled: true
    repo: fukui-kanko-trend-data
    area_name: "美浜町"

  hotel:
    enabled: true
    # Mikata Five Lakes area feed (3 hotels, from 2025-06), right next to
    # the Rainbow Line — replaces the regional echizen-coast feed per tech
    # lead review of PR #6.
    repo: mikatagoko-kanko-reservation
    scope: area-specific

  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300059]  # レインボーライン エリア — direct, exact match

  traffic:
    enabled: true
    point_code: 6810590
    distance_km: 5.0
    reason: >
      Included but flagged — this CCTV counter is ~5km from the node
      coordinates, queried live 2026-09-25 (the permanent-counter layer
      has zero coverage in this whole region). NOT confirmed to sit on
      the actual toll road access route; verify before treating this as a
      precise local signal.

  road_congestion:
    enabled: true  # TomTom Orbis flow tiles, needs TOMTOM_API_KEY; see sources/road_congestion.py
    radius_km: 2

  google_reviews:
    enabled: true  # Apify Google Maps Reviews Scraper, needs APIFY_TOKEN; see sources/google_reviews.py
    place_id: "ChIJY1v1P_DdAWARwMvznJtMeMo"  # Google Maps: Rainbow Line

  rakuten:
    enabled: true  # Rakuten Travel availability, snapshotted daily (collect-rakuten.yml); see sources/rakuten.py
    search_radius_km: 3
    # the summit is remote: few Rakuten hotels are within 3km (Rakuten's maximum)
    lead_days: [1, 7, 30]
    adult_num: 2

  instagram:
    enabled: false
    reason: >
      Instagram location id not found yet. Look it up with the Collect
      Instagram posts workflow (find_places: レインボーライン山頂公園, Rainbow Line), then set
      location_id and enabled: true.

  social_listening:
    enabled: true  # Bluesky, YouTube, Reddit posts naming the site, weekly (collect-social.yml); see sources/social_listening.py
    # レインボーライン alone also names a Tokyo bus and a brand
    keywords: ["三方五湖", "レインボーライン 福井", "Mikata Five Lakes", "Rainbow Line Fukui", "미카타고코"]
