node_key: katsuyama
label: "Katsuyama (勝山)"
coordinates:
  lat: 36.0764
  lon: 136.5011  # approx., かつやま恐竜の森 area (Fukui Prefectural Dinosaur Museum)

# Official annual visitors (観光客入込数, gross visits), used to convert a
# forecast's measured count into visitors. See docs/site_capacity.md.
official_visitors:
  year: 2025
  count: 1562000
  source: "https://www.pref.fukui.lg.jp/doc/kankou/fukuiken-kankoukyakusu_d/fil/024.pdf"
  note: "Katsuyama area figure; the museum alone reported 1.30M for FY2025 (Apr-Mar)"

sources:
  camera:
    enabled: false
    reason: >
      No camera source exists for Katsuyama in fukui-kanko-people-flow-data
      (only tojinbo-shotaro, fukui-station-east-entrance, and the two
      rainbow-line gates are present). Do not fabricate one — this gap is
      real and stays visible in the coverage report as "unavailable."

  weather:
    enabled: true
    station_name: "勝山 (Katsuyama)"
    station_id: "57082"
    prec_no: "57"
    block_no: "1226"
    page: hourly_a1
    start_date: "2024-12-01"

  rsi:
    enabled: true
    repo: fukui-kanko-trend-data
    area_name: "勝山市"

  hotel:
    enabled: true
    repo: echizen-coast-kanko-reservation
    scope: regional

  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300019]  # かつやま恐竜の森 エリア only — the main tourist draw closest to
                          # the (currently unavailable) camera-adjacent landmark, chosen
                          # over pooling all 6 勝山市 area entries. See PR discussion.

  traffic:
    enabled: true
    layer: t_travospublic_measure_1h  # permanent counter layer, not CCTV
    point_code: 6110860
    distance_km: 5.3
    reason: >
      Included but flagged: permanent counter ~5.3km away (queried live
      2026-09-27). The earlier ~22.5km figure was the CCTV layer only; the
      permanent layer was not checked then. NOT confirmed to sit on the
      road to the Dinosaur Museum; verify before relying on it.

  footfall_proxy:
    enabled: true  # no camera here: nearest camera + pooled nearby survey volume
    radii_km: [5, 15]  # 30km would reach Fukui Station, a city hub: too different to stand in

  visitor_reservation:
    enabled: true
    # Dinosaur Museum advance entry bookings, daily since 2023-09. Reserved
    # entries only (~57% of reported FY2025 visitors), see module docstring.
    repo: dinosaur-opendata

  road_congestion:
    enabled: true  # TomTom Orbis flow tiles, needs TOMTOM_API_KEY; see sources/road_congestion.py
    radius_km: 2
