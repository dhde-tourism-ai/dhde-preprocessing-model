node_key: eiheiji
label: "Eiheiji Temple (大本山 永平寺)"
coordinates:
  lat: 36.0567754
  lon: 136.3568759  # 大本山 永平寺 エリア, area.csv 親番号 300025

# Official annual visitors (観光客入込数, gross visits), used to convert a
# forecast's measured count into visitors. See docs/site_capacity.md.
official_visitors:
  year: 2025
  count: 518000
  source: "https://www.pref.fukui.lg.jp/doc/kankou/fukuiken-kankoukyakusu_d/fil/024.pdf"

sources:
  camera:
    enabled: false
    reason: >
      No camera source exists for Eiheiji in fukui-kanko-people-flow-data
      (checked 2026-09-27). Do not fabricate one — this gap stays visible
      in the coverage report as "unavailable."

  weather:
    enabled: true
    # Closest station is 美山 (Miyama, 57071, ~6.5km), but it records
    # precipitation only — no temperature, wind, sunshine or humidity.
    # Fukui (~12km, same plain) is the nearest full-observation station.
    station_name: "福井 (Fukui)"
    station_id: "57066"
    prec_no: "57"
    block_no: "47616"
    page: hourly_s1
    start_date: "2024-12-01"

  rsi:
    enabled: true
    repo: fukui-kanko-trend-data
    area_name: "永平寺町"  # tracked from the 2024 folder onward

  hotel:
    enabled: true
    repo: echizen-coast-kanko-reservation
    scope: regional

  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300025]  # 大本山 永平寺 エリア (formerly 永平寺門前 エリア)

  traffic:
    enabled: true
    layer: t_travospublic_measure_1h  # permanent counter layer, not CCTV
    point_code: 6110870
    distance_km: 2.5
    reason: >
      Included but flagged: permanent counter ~2.5km from the temple
      (queried live 2026-09-27; nearest CCTV counter is ~10.4km). NOT
      confirmed to sit on the road visitors use to reach Eiheiji; verify
      before treating this as a precise local signal.

  footfall_proxy:
    enabled: true  # no camera here: nearest camera + pooled nearby survey volume
    radii_km: [5, 15]  # 30km would reach Fukui Station, a city hub: too different to stand in

  road_congestion:
    enabled: true  # TomTom Orbis flow tiles, needs TOMTOM_API_KEY; see sources/road_congestion.py
    radius_km: 2

  google_reviews:
    enabled: true  # Apify Google Maps Reviews Scraper, needs APIFY_TOKEN; see sources/google_reviews.py
    place_id: "ChIJzYo4YsSX-F8R6Sl4_CeuUyw"  # Google Maps: Daihonzan Eiheiji

  rakuten:
    enabled: true  # Rakuten Travel availability, snapshotted daily (collect-rakuten.yml); see sources/rakuten.py
    search_radius_km: 3
    # hotels within 3km of the temple; its `hotel` feed is the regional Echizen coast one, not a local one
    lead_days: [1, 7, 30]
    adult_num: 2

  instagram:
    enabled: true  # Instagram posts tagged here, weekly via Apify (collect-instagram.yml); see sources/instagram.py
    location_id: "265778687"  # instagram.com/explore/locations/265778687/, page title "永平寺" (checked 2026-10-01)
