node_key: kanazawa
label: "Kanazawa (金沢)"
coordinates:
  lat: 36.5621
  lon: 136.6625  # Kenroku-en

sources:
  # Ishikawa node. code4fukui's camera, RSI and hotel datasets are
  # Fukui-only, so those are disabled rather than filled with Fukui data.
  # Survey and (Kanazawa only) info_desk come from Milli, Ishikawa's
  # tourism open data.
  camera:
    enabled: false
    reason: >
      fukui-kanko-people-flow-data covers Fukui sensors only, and no public
      people-counting camera data was found for Kanazawa (checked 2026-09-27).

  rsi:
    enabled: false
    reason: >
      fukui-kanko-trend-data tracks Fukui municipalities only. No Ishikawa
      equivalent of its Google Business Profile metrics was found.

  hotel:
    enabled: false
    reason: >
      The code4fukui reservation repos cover Fukui areas only. The only
      Ishikawa accommodation figure found is JTA's monthly prefecture-wide
      total, which is not a daily per-node signal.

  weather:
    enabled: true
    station_name: "金沢 (Kanazawa)"
    prec_no: "56"  # Ishikawa — not 57
    block_no: "47605"  # nearest JMA station, ~3.9km
    page: hourly_s1
    start_date: "2024-12-01"

  survey:
    enabled: true
    provider: milli  # Ishikawa's QR survey (Milli), not fukui-kanko-survey — see sources/survey_milli.py
    repo: ishikawa-kanko-survey  # code4fukui, pulls Milli daily
    facilities_sheet_id: "1IwKFT7ZiNYK4RStuF-1vN3EDf4_L9ohhbC7aeawk10s"  # facility list with 市町
    cities: ["金沢市"]

  traffic:
    enabled: true
    point_code: 4810570
    distance_km: 1.2
    reason: >
      Included but flagged — CCTV counter ~1.2km from Kenroku-en, queried
      live 2026-09-27. General city-centre traffic, not confirmed to be the
      road visitors use to reach the site.

  info_desk:
    enabled: true
    desks:
      - name: 金沢駅観光案内所
        sheet_id: "1i4cCSjZWu9zwAOIHHv3ejEimL-eP_G_D62cMPPowWjA"
      - name: 金沢中央観光案内所
        sheet_id: "1rgj-IGrCRETkV72Ve0ztFsIeYniy1rAZXzOxCyqFuoE"

  monthly_visitors:
    enabled: true
    repo: japan-kanko-stat
    city_lgcode: 17201
    pref_lgcode: 17

  rakuten:
    enabled: true
    search_radius_km: 3
    lead_days: [1, 7, 30]
    adult_num: 2
