node_key: fukui_station
label: "Fukui Station East Entrance (福井駅東口)"
coordinates:
  lat: 36.0614
  lon: 136.2217

# Official annual visitors (観光客入込数, gross visits), used to convert a
# forecast's measured count into visitors. See docs/site_capacity.md.
official_visitors:
  year: 2025
  count: null
  source: "https://www.pref.fukui.lg.jp/doc/kankou/fukuiken-kankoukyakusu_d/fil/024.pdf"
  note: "not broken out in the prefecture's figures (Fukui City total only), so no visitor conversion"

sources:
  camera:
    enabled: true
    # A city transport hub: its footfall doesn't track tourist sites, so it
    # is never used as another node's footfall proxy (see footfall_proxy.py).
    proxy_eligible: false
    gates:
      - name: fukui_station
        person_csv: fukui-kanko-people-flow-data/full/fukui-station-east-entrance/Person.csv
        face_csv: fukui-kanko-people-flow-data/full/fukui-station-east-entrance/Face.csv

  weather:
    enabled: true
    station_name: "福井 (Fukui)"
    station_id: "57066"
    prec_no: "57"
    block_no: "47616"  # Fukui City main station — distinct from Tsuruga (block_no 47631)
    page: hourly_s1
    start_date: "2024-12-01"

  rsi:
    enabled: true
    repo: fukui-kanko-trend-data
    area_name: null  # Fukui City is not a tracked municipality in this dataset — total only

  hotel:
    enabled: true
    repo: fukui-station-kanko-reservation
    scope: station-specific  # 3 hotels near Fukui Station, 585 rooms total — see hotel.py docstring

  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300004]  # 福井駅前 エリア

  traffic:
    enabled: true
    point_code: 6810150
    distance_km: 2.7
    reason: >
      Included but flagged — this CCTV counter is ~2.7km from the station
      coordinates, queried live 2026-09-25. NOT confirmed to sit on the
      actual road visitors use to reach the station; verify before
      treating this as a precise local signal.

  road_congestion:
    enabled: true  # TomTom Orbis flow tiles, needs TOMTOM_API_KEY; see sources/road_congestion.py
    radius_km: 2

  google_reviews:
    enabled: true  # Apify Google Maps Reviews Scraper, needs APIFY_TOKEN; see sources/google_reviews.py
    place_id: "ChIJV5xzMu2--F8RWQ-vfzwcJFs"  # Google Maps: Fukui Station

  rakuten:
    enabled: true  # Rakuten Travel availability, snapshotted daily (collect-rakuten.yml); see sources/rakuten.py
    search_radius_km: 3
    lead_days: [1, 7, 30]
    adult_num: 2

  instagram:
    enabled: false
    reason: >
      Instagram location id not found yet. Look it up with the Collect
      Instagram posts workflow (find_places: 福井駅, Fukui Station), then set
      location_id and enabled: true.

  social_listening:
    enabled: true  # Bluesky, YouTube, Reddit posts naming the site, weekly (collect-social.yml); see sources/social_listening.py
    keywords: ["福井駅", "福井站", "Fukui Station", "후쿠이역"]
