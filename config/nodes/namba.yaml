node_key: namba
label: "Namba / Dotonbori (難波・道頓堀)"
coordinates:
  lat: 34.6687
  lon: 135.5013  # Ebisubashi, Dotonbori

sources:
  # Osaka node. Same source layout as the Fukui nodes, but code4fukui's
  # camera, RSI, hotel and survey datasets are Fukui-only and no Osaka
  # equivalent was found (see docs/osaka_kyoto_sources.md), so those are
  # disabled rather than filled with another prefecture's data.
  camera:
    enabled: false
    reason: >
      fukui-kanko-people-flow-data covers Fukui sensors only, and no public
      people-counting camera data was found for Namba / Dotonbori (checked
      2026-09-27).

  weather:
    enabled: true
    station_name: "大阪 (Osaka)"
    prec_no: "62"  # 大阪府
    block_no: "47772"  # nearest full-observation JMA station, ~2.1km
    page: hourly_s1
    start_date: "2024-12-01"

  rsi:
    enabled: false
    reason: >
      fukui-kanko-trend-data tracks Fukui municipalities only, and no Osaka
      equivalent of its Google Business Profile metrics was found. (The Kyoto
      'RSI' link suggested, data.city.kyoto.lg.jp dataset 00618, is road
      damage data.)

  hotel:
    enabled: false
    reason: >
      The code4fukui reservation repos cover Fukui areas only; no daily Osaka
      reservation feed was found (the Kyoto sites suggested are paid Airbnb
      data). Hotel availability comes from the rakuten source below.

  survey:
    enabled: false
    reason: >
      No open visitor survey with daily responses was found for Osaka; the
      prefecture publishes annual tourism reports only.

  traffic:
    enabled: false
    reason: >
      Nearest CCTV counter (6810980, ~2.1km) reads 0 on 87 of the last 91 days
      (checked 2026-09-27): effectively not reporting. The next points are
      osaka_station's (6810105) and osaka_castle's candidate (6811080, also
      mostly 0), so no usable point is left for Namba.

  monthly_visitors:
    enabled: true
    repo: japan-kanko-stat
    city_lgcode: 27128  # 中央区; japan-kanko-stat has wards, not the whole city
    pref_lgcode: 27

  rakuten:
    enabled: true
    search_radius_km: 1  # dense city: 3km circles would overlap the neighbouring nodes
    lead_days: [1, 7, 30]
    adult_num: 2
