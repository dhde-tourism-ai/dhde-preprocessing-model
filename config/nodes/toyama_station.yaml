node_key: toyama_station
label: "Toyama Station (富山駅)"
coordinates:
  lat: 36.7013
  lon: 137.2133  # JR Toyama Station — Hokuriku Shinkansen stop

sources:
  # Toyama node. code4fukui's RSI and hotel datasets are Fukui-only, so
  # those are disabled rather than filled with Fukui data. Survey comes
  # from TOYTOS, Toyama's tourism web survey.
  camera:
    enabled: true
    provider: toyama_city  # Toyama City AI cameras — see sources/camera_toyama.py
    start_date: "2023-02-28"
    gates:
      - name: free_passage
        camera_id: "07"  # 富山駅構内(南北自由通路) — the through-route under the station
      - name: north_exit
        camera_id: "04"  # 富山駅北口(中央)

  rsi:
    enabled: false
    reason: >
      fukui-kanko-trend-data tracks Fukui municipalities only. No Toyama
      equivalent of its Google Business Profile metrics was found.

  hotel:
    enabled: false
    reason: >
      The code4fukui reservation repos cover Fukui areas only. No daily
      Toyama reservation feed was found.

  weather:
    enabled: true
    station_name: "富山 (Toyama)"
    prec_no: "55"  # Toyama
    block_no: "47607"  # nearest JMA station, ~1.3km
    page: hourly_s1
    start_date: "2024-12-01"

  survey:
    enabled: true
    provider: toytos  # Toyama's tourism web survey — see sources/survey_toytos.py
    ckan_dataset: kanko_data
    resource_name: "富山県観光ウェブアンケート"
    fallback_url: "https://toyama-pref.box.com/shared/static/6tpwiv96wzngxsk3rio1t1vi1dhordnn.csv"
    cities: ["富山市"]

  traffic:
    enabled: true
    point_code: 4810470
    distance_km: 2.3
    reason: >
      Included but flagged — CCTV counter ~2.3km from Toyama Station, queried live
      2026-09-27. Not confirmed to be the road visitors use.

  monthly_visitors:
    enabled: true
    repo: japan-kanko-stat
    city_lgcode: 16201
    pref_lgcode: 16

  rakuten:
    enabled: true
    search_radius_km: 3
    lead_days: [1, 7, 30]
    adult_num: 2
