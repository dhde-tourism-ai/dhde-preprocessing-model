node_key: awara_onsen
label: "Awara Onsen (あわら温泉)"
coordinates:
  lat: 36.2256037
  lon: 136.1941521  # あわら湯のまち エリア, area.csv 親番号 300011

# Official annual visitors (観光客入込数, gross visits), used to convert a
# forecast's measured count into visitors. See docs/site_capacity.md.
official_visitors:
  year: 2025
  count: 658000
  source: "https://www.pref.fukui.lg.jp/doc/kankou/fukuiken-kankoukyakusu_d/fil/024.pdf"

sources:
  camera:
    enabled: false
    reason: >
      No camera source exists for Awara Onsen in fukui-kanko-people-flow-data
      (only tojinbo-shotaro, fukui-station-east-entrance, and the two
      rainbow-line gates are present, checked 2026-09-27). Do not fabricate
      one — this gap stays visible in the coverage report as "unavailable."

  weather:
    enabled: true
    station_name: "三国 (Mikuni)"
    station_id: "57001"  # nearest JMA station, ~2.7km (same station as Tojinbo)
    prec_no: "57"
    block_no: "1071"
    page: hourly_a1
    start_date: "2024-12-01"

  rsi:
    enabled: true
    repo: fukui-kanko-trend-data
    area_name: "あわら市"  # tracked from the 2024 folder onward

  hotel:
    enabled: true
    # Despite the generic name, this repo is the Awara Onsen area feed
    # (its README: "あわら温泉エリア 宿泊予約状況"), same format as the others.
    repo: fukui-kanko-reservation
    scope: area-specific

  survey:
    enabled: true
    repo: fukui-kanko-survey
    area_ids: [300011]  # あわら湯のまち エリア (formerly あわら温泉 エリア)

  traffic:
    enabled: false
    reason: >
      No JARTIC monitoring point within range — nearest CCTV counter
      (6810135) is ~8.1km away, nearest permanent counter ~8.4km (queried
      live 2026-09-27).

  footfall_proxy:
    enabled: true  # no camera here: nearest camera + pooled nearby survey volume
    radii_km: [5, 15]  # 30km would reach Fukui Station, a city hub: too different to stand in

  road_congestion:
    enabled: true  # TomTom Orbis flow tiles, needs TOMTOM_API_KEY; see sources/road_congestion.py
    radius_km: 2

  google_reviews:
    enabled: false
    reason: >
      Not scraped yet. Awara Onsen is a town of ryokan, not one place on
      Google Maps: pick the place (or places) that stand for it and add
      its place_id here.

  rakuten:
    enabled: true  # Rakuten Travel availability, snapshotted daily (collect-rakuten.yml); see sources/rakuten.py
    search_radius_km: 3
    lead_days: [1, 7, 30]
    adult_num: 2

  instagram:
    enabled: false
    reason: >
      Instagram location id not found yet. Look it up with the Collect
      Instagram posts workflow (find_places: あわら温泉, Awara Onsen), then set
      location_id and enabled: true.

  social_listening:
    enabled: true  # Bluesky, YouTube, Reddit posts naming the site, weekly (collect-social.yml); see sources/social_listening.py
    keywords: ["あわら温泉", "芦原温泉", "蘆原溫泉", "Awara Onsen", "아와라 온천"]
